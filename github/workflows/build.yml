name: Build Nation Nums Android App

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/nationnums/app

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "NationNums"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
              id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.nationnums.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.nationnums.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 2
                  versionName '1.1'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'androidx.core:core-ktx:1.13.1'
              implementation 'androidx.biometric:biometric:1.1.0'
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.USE_BIOMETRIC" />

              <application
                  android:allowBackup="false"
                  android:label="Nation Nums"
                  android:usesCleartextTraffic="false"
                  android:theme="@style/Theme.AppCompat.DayNight.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/nationnums/app/MainActivity.kt <<'EOF'
          package com.nationnums.app

          import android.net.Uri
          import android.os.Bundle
          import android.webkit.JavascriptInterface
          import android.webkit.WebChromeClient
          import android.webkit.WebResourceRequest
          import android.webkit.WebSettings
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import androidx.appcompat.app.AppCompatActivity
          import androidx.biometric.BiometricManager
          import androidx.biometric.BiometricPrompt
          import androidx.core.content.ContextCompat

          class MainActivity : AppCompatActivity() {
              private lateinit var webView: WebView
              private var backgroundedAt: Long = 0L
              private var promptInFlight = false

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  webView = WebView(this)
                  webView.settings.javaScriptEnabled = true
                  webView.settings.domStorageEnabled = true
                  webView.settings.cacheMode = WebSettings.LOAD_DEFAULT

                  webView.webViewClient = object : WebViewClient() {
                      override fun shouldOverrideUrlLoading(
                          view: WebView,
                          request: WebResourceRequest
                      ): Boolean {
                          return request.url.scheme != "https"
                      }
                  }

                  webView.webChromeClient = WebChromeClient()
                  webView.addJavascriptInterface(BiometricBridge(), "NationNative")
                  setContentView(webView)

                  if (savedInstanceState == null) {
                      webView.loadUrl("https://nation-nums.base44.app")
                  } else {
                      webView.restoreState(savedInstanceState)
                  }
              }

              // The website calls window.NationNative to unlock with the device biometric.
              inner class BiometricBridge {
                  @JavascriptInterface
                  fun isBiometricAvailable(): Boolean {
                      if (!trustedPage()) return false
                      val allowed = BiometricManager.Authenticators.BIOMETRIC_STRONG or
                          BiometricManager.Authenticators.BIOMETRIC_WEAK
                      return BiometricManager.from(this@MainActivity)
                          .canAuthenticate(allowed) == BiometricManager.BIOMETRIC_SUCCESS
                  }

                  @JavascriptInterface
                  fun requestBiometricUnlock() {
                      if (!trustedPage()) return
                      runOnUiThread { showBiometricPrompt() }
                  }
              }

              private fun showBiometricPrompt() {
                  if (promptInFlight) return
                  promptInFlight = true

                  val callback = object : BiometricPrompt.AuthenticationCallback() {
                      override fun onAuthenticationSucceeded(
                          result: BiometricPrompt.AuthenticationResult
                      ) {
                          promptInFlight = false
                          notifyWeb(true)
                      }

                      override fun onAuthenticationError(
                          errorCode: Int,
                          errString: CharSequence
                      ) {
                          promptInFlight = false
                          notifyWeb(false)
                      }

                      override fun onAuthenticationFailed() {
                          // The prompt stays open so the customer can try again.
                      }
                  }

                  val allowed = BiometricManager.Authenticators.BIOMETRIC_STRONG or
                      BiometricManager.Authenticators.BIOMETRIC_WEAK

                  val prompt = BiometricPrompt(
                      this,
                      ContextCompat.getMainExecutor(this),
                      callback
                  )

                  val promptInfo = BiometricPrompt.PromptInfo.Builder()
                      .setTitle("Unlock Nation Nums")
                      .setSubtitle("Use your fingerprint or face to continue")
                      .setNegativeButtonText("Cancel")
                      .setAllowedAuthenticators(allowed)
                      .build()

                  prompt.authenticate(promptInfo)
              }

              private fun notifyWeb(success: Boolean) {
                  val js = "window.dispatchEvent(new MessageEvent('message'," +
                      "{data:{type:'biometricUnlockResult',success:" + success + "}}))"
                  webView.post { webView.evaluateJavascript(js, null) }
              }

              private fun dispatchResume(inactiveMs: Long) {
                  val js = "window.dispatchEvent(new CustomEvent('nn-native-resume'," +
                      "{detail:{inactiveMs:" + inactiveMs + "}}))"
                  webView.post { webView.evaluateJavascript(js, null) }
              }

              private fun trustedPage(): Boolean {
                  val host = webView.url?.let { Uri.parse(it).host } ?: return false
                  return host == "nation-nums.base44.app" ||
                      host.endsWith(".base44.app") ||
                      host == "nationnums.com" ||
                      host.endsWith(".nationnums.com")
              }

              override fun onStop() {
                  backgroundedAt = System.currentTimeMillis()
                  super.onStop()
              }

              override fun onResume() {
                  super.onResume()
                  if (backgroundedAt > 0L) {
                      val inactiveMs = System.currentTimeMillis() - backgroundedAt
                      backgroundedAt = 0L
                      dispatchResume(inactiveMs)
                  }
              }

              override fun onSaveInstanceState(outState: Bundle) {
                  webView.saveState(outState)
                  super.onSaveInstanceState(outState)
              }

              @Deprecated("Deprecated in Android")
              override fun onBackPressed() {
                  if (webView.canGoBack()) {
                      webView.goBack()
                  } else {
                      super.onBackPressed()
                  }
              }

              override fun onDestroy() {
                  webView.destroy()
                  super.onDestroy()
              }
          }
          EOF

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NationNums-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
